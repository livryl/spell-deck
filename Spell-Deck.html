<style>
:root{--bg:#f6f4fa;--card:#fff;--ink:#2a2733;--sub:#7a7588;--line:#e3dfec;--acc:#7c5cff;--accbg:#efeaff;--fav:#f5a524;--ok:#2e9e6b;--warn:#d9534f}
@media (prefers-color-scheme:dark){:root{--bg:#19171f;--card:#242130;--ink:#ece9f5;--sub:#9b96ab;--line:#37334a;--acc:#9b83ff;--accbg:#332d52;--fav:#f5b544;--ok:#4cc38a;--warn:#ef7b77}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:8px}
#q{flex:0 1 280px;min-width:100px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#bar{flex-wrap:nowrap}.ttl{font-size:17px;color:var(--acc);letter-spacing:.02em}#status{margin-left:auto}.ver{font-size:11px;color:var(--sub);margin-left:-4px;align-self:flex-end;padding-bottom:4px}#bar>*{flex-shrink:0}#bar>#q{flex-shrink:1}
@media(max-width:760px){#bar{flex-wrap:wrap}}
#tagpanel{margin-top:8px;max-height:40vh;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#tagbtn.on{background:var(--accbg);border-color:var(--acc)}
#status{font-size:13px;color:var(--sub)}
#status.ok{color:var(--ok)}#status.dirty{color:var(--warn)}
#banner{display:none;margin:12px 16px 0;padding:10px 14px;background:var(--accbg);border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:99px;font-size:13px;background:var(--card);border:1px solid var(--line)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip small{opacity:.7}
main{padding:10px 16px}
#count{font-size:13px;color:var(--sub);margin-bottom:8px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}.card h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{margin:0;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.tags{font-size:12px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:4px;margin-top:auto}.acts button{padding:1px 8px;font-size:13px;line-height:1.5;border-radius:6px}
.acts .cp{flex:1}
.star{border:none;background:none;padding:0 2px;font-size:20px;line-height:1;color:var(--line)}
.star.on{color:var(--fav)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
dialog{width:min(560px,94vw);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:13px;color:var(--sub);margin:10px 0 2px}
dialog input,dialog textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
dialog textarea{min-height:120px;resize:vertical}
#dupwarn{margin-top:4px;font-size:12px;color:var(--warn)}
.dup{color:var(--warn);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.95}
</style>

/* ---- IndexedDB（ファイルの場所を記憶） ---- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('pm',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kv(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('k',mode);const rq=fn(t.objectStore('k'));t.oncomplete=()=>res(rq.result);t.onerror=()=>rej(t.error)})}

const metaP=kv('readonly',s=>s.get('m')).then(m=>{meta=m||{}}).catch(()=>{});
/* ---- 読み込み・保存 ---- */
function parse(t){
  if(!t.trim()){data={version:1,characters:[]};return}
  try{const d=JSON.parse(t);if(!Array.isArray(d.characters))throw 0;data=d;data.characters.forEach((c,i)=>{c.id='c'+i+'_'+Date.now().toString(36);const m=meta[c.name];if(m)Object.assign(c,m);c.fav=!!c.fav;c.updated=c.updated||0;c.used=c.used||0});saveMeta()}
  catch(e){alert('ファイルの形式が正しくありません。データは読み込まれませんでした。');throw e}
}
async function readHandle(h){await metaP;parse(await (await h.getFile()).text());handle=h;dirty=false;render();status()}
async function grant(h){
  const o={mode:'readwrite'};
  return (await h.queryPermission(o))==='granted'||(await h.requestPermission(o))==='granted';
}
async function openFile(){
  if(dirty&&!confirm('未保存の変更があります。破棄して開きますか？'))return;
  if(FSA){
    try{const [h]=await showOpenFilePicker(PICK);if(!await grant(h))return;
      await readHandle(h);await kv('readwrite',s=>s.put(h,'h'));$('#banner').style.display='none';toast('読み込みました')}catch(e){}
  }else{
    const i=document.createElement('input');i.type='file';i.accept='.txt,text/plain';
    i.onchange=async()=>{if(i.files[0]){await metaP;parse(await i.files[0].text());dirty=false;render();status();toast('読み込みました')}};i.click();
  }
}
async function createFile(){
  if(!FSA)return toast('この機能はChrome/Edgeで使えます');
  try{const h=await showSaveFilePicker({suggestedName:'prompts.txt',...PICK});handle=h;
    await kv('readwrite',s=>s.put(h,'h'));await save()}catch(e){}
}
async function save(){
  clearTimeout(timer);
  const text=JSON.stringify(data,(k,v)=>['id','fav','updated','used'].includes(k)?undefined:v,1);
  if(handle){
    try{if(!await grant(handle))return toast('書き込みが許可されませんでした');
      const w=await handle.createWritable();await w.write(text);await w.close();
      dirty=false;status();return toast('保存しました')}catch(e){return toast('保存に失敗しました')}
  }
  if(FSA)return createFile();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download='prompts.txt';a.click();dirty=false;status();toast('prompts.txt をダウンロードしました');
}
function saveMeta(){data.characters.forEach(c=>meta[c.name]={fav:!!c.fav,updated:c.updated||0,used:c.used||0});kv('readwrite',s=>s.put(meta,'m')).catch(()=>{})}
function touch(){saveMeta();dirty=true;status();render();if(handle){clearTimeout(timer);timer=setTimeout(save,600)}}
function status(){
  const s=$('#status');
  s.className=dirty?'dirty':(handle?'ok':'');
  s.textContent=dirty?'● 未保存':handle?`✔ ${handle.name}（自動保存）`:(FSA?'ファイル未接続':'※手動保存モード');
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---- 表示 ---- */
function render(){
  const q=$('#q').value.trim().toLowerCase(),all=data.characters;
  const cnt={};all.forEach(c=>(c.tags||[]).forEach(t=>cnt[t]=(cnt[t]||0)+1));
  sel.forEach(t=>{if(!cnt[t])sel.delete(t)});
  const tags=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,'ja'));
  $('#tagbar').innerHTML=`<button class="chip ${onlyFav?'on':''}" data-fav>★のみ</button>`+
    tags.map(t=>`<button class="chip ${sel.has(t)?'on':''}" data-tag="${esc(t)}">${esc(t)} <small>${cnt[t]}</small></button>`).join('');
  const n=sel.size+(onlyFav?1:0),tb=$('#tagbtn');tb.textContent='🏷 タグ'+(n?` (${n})`:'')+($('#tagpanel').hidden?' ▼':' ▲');tb.classList.toggle('on',n>0);
  const sort=$('#sort').value;
  const list=all.filter(c=>(!onlyFav||c.fav)&&[...sel].every(t=>(c.tags||[]).includes(t))&&
    (!q||[c.name,c.prompt,(c.tags||[]).join(' '),c.memo].join('\n').toLowerCase().includes(q)))
    .sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(sort==='updated'?(b.updated||0)-(a.updated||0):sort==='used'?(b.used||0)-(a.used||0):0)||a.name.localeCompare(b.name,'ja'));
  const nc={};all.forEach(c=>nc[c.name]=(nc[c.name]||0)+1);
  $('#list').innerHTML=list.length?list.map(c=>`
    <div class="card" data-id="${c.id}">
      <h3><span>${nc[c.name]>1?'<span class="dup" title="同名のカードがあります">⚠</span> ':''}${esc(c.name||'(名前なし)')}</span><button class="star ${c.fav?'on':''}" data-a="fav" aria-label="お気に入り">★</button></h3>
      <div class="tags" title="${esc((c.tags||[]).join(' / '))}">${(c.tags||[]).map(t=>'#'+esc(t)).join(' ')}</div>
      <div class="acts"><button class="pri cp" data-a="copy">コピー</button><button data-a="edit">編集</button></div>
    </div>`).join(''):`<div class="empty">${all.length?'条件に合うキャラがいません':'まだキャラがいません。「＋ 新規」から追加してね'}</div>`;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}

/* ---- 操作 ---- */
async function copy(c){
  try{await navigator.clipboard.writeText(c.prompt)}
  catch(e){const t=document.createElement('textarea');t.value=c.prompt;document.body.append(t);t.select();document.execCommand('copy');t.remove()}
  c.used=Date.now();toast(`「${c.name}」をコピーしました`);
  saveMeta();
}
function openEdit(id){
  editId=id;const c=data.characters.find(x=>x.id===id)||{};
  $('#dtitle').textContent=id?'キャラクターを編集':'新規キャラクター';
  $('#fname').value=c.name||'';$('#fprompt').value=c.prompt||'';$('#ftags').value=(c.tags||[]).join(', ');$('#fmemo').value=c.memo||'';
  $('#del').style.visibility=$('#dup').style.visibility=id?'visible':'hidden';
  checkDup();$('#dlg').showModal();$('#fname').focus();
}
function checkDup(){
  const n=$('#fname').value.trim(),w=$('#dupwarn');
  const k=n?data.characters.filter(c=>c.name===n&&c.id!==editId).length:0;
  w.hidden=!k;
  if(k)w.textContent=`⚠ 同じ名前のカードが既に${k}件あります。見分けがつくように名前を変えるのがおすすめです（このまま保存もできます）`;
}
$('#fname').addEventListener('input',checkDup);
function readForm(){return{name:$('#fname').value.trim(),prompt:$('#fprompt').value.trim(),
  tags:[...new Set($('#ftags').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean))],memo:$('#fmemo').value.trim()}}
$('#ok').onclick=()=>{
  const f=readForm();if(!f.name)return toast('名前を入れてね');
  if(editId){const o=data.characters.find(x=>x.id===editId);if(o.name!==f.name)delete meta[o.name];Object.assign(o,f,{updated:Date.now()})}
  else data.characters.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),...f,fav:false,updated:Date.now(),used:0});
  $('#dlg').close();touch();
};
$('#dup').onclick=()=>{const f=readForm();data.characters.push({id:'c'+Date.now().toString(36),...f,name:f.name+'（コピー）',fav:false,updated:Date.now(),used:0});$('#dlg').close();touch();toast('複製しました')};
$('#del').onclick=()=>{if(confirm('このキャラを削除しますか？')){const d=data.characters.find(x=>x.id===editId);if(d)delete meta[d.name];data.characters=data.characters.filter(x=>x.id!==editId);$('#dlg').close();touch()}};
$('#dclose').onclick=()=>$('#dlg').close();
$('#add').onclick=()=>openEdit(null);
$('#open').onclick=openFile;$('#save').onclick=save;$('#tagbtn').onclick=()=>{const p=$('#tagpanel');p.hidden=!p.hidden;render()};
$('#q').oninput=render;$('#sort').onchange=render;
$('#clear').onclick=()=>{$('#q').value='';sel.clear();onlyFav=false;render()};
$('#tagbar').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  if('fav' in b.dataset)onlyFav=!onlyFav;else{const t=b.dataset.tag;sel.has(t)?sel.delete(t):sel.add(t)}render()};
$('#list').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.closest('.card').dataset.id,c=data.characters.find(x=>x.id===id);
  if(b.dataset.a==='copy')copy(c);
  else if(b.dataset.a==='edit')openEdit(id);
  else{c.fav=!c.fav;saveMeta();render()}
};

/* ---- 起動時：前回のファイルを自動で読む ---- */
(async()=>{
  render();status();
  if(!FSA)return;
  try{
    const h=await kv('readonly',s=>s.get('h'));if(!h)return;
    if(await h.queryPermission({mode:'readwrite'})==='granted'){await readHandle(h)}
    else{
      const b=$('#banner');b.style.display='block';
      b.innerHTML=`前回のファイル「${esc(h.name)}」があります。 <button class="pri" id="resume">読み込む（許可）</button>`;
      $('#resume').onclick=async()=>{try{if(await grant(h)){await readHandle(h);b.style.display='none';toast('前回のファイルを読み込みました')}}catch(e){toast('読み込めませんでした')}};
    }
  }catch(e){}
})();
</script>
</body>
</html>
